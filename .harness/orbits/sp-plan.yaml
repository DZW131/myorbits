id: sp-plan
name: Superpowers Plan Orbit
description: >
  Turn an approved design into an executable implementation plan.

meta:
  file: .harness/orbits/sp-plan.yaml
  include_in_projection: true
  include_in_write: true
  include_in_export: true
  include_description_in_orchestration: true
  agents_template: |
    # sp-plan

    You are responsible for planning only.

    Convert an approved design into a clear execution plan:
    - define scope, milestones, and task slices
    - assign verification for each task
    - record risks and open questions
    - stop before coding, debugging, or branch finish

    Read `docs/orbits/sp-plan/rules.md`.
    Follow `docs/orbits/sp-plan/process.md`.
    Write the plan in `docs/orbits/sp-plan/subject.md`.

members:
  - key: plan-artifact
    name: Plan Artifact
    description: The execution plan produced by this orbit.
    role: subject
    paths:
      include:
        - docs/orbits/sp-plan/subject.md
    scopes:
      write: true
      export: true

  - key: plan-rules
    name: Plan Rules
    description: Rules and guardrails for planning work.
    role: rule
    paths:
      include:
        - docs/orbits/sp-plan/rules.md

  - key: plan-process
    name: Plan Process
    description: The planning workflow and handoff sequence.
    role: process
    paths:
      include:
        - docs/orbits/sp-plan/process.md
    scopes:
      export: true

rules:
  scope:
    projection_roles: [meta, subject, rule, process]
    write_roles: [meta, rule]
    export_roles: [meta, rule]
    orchestration_roles: [meta, rule, process]
  orchestration:
    include_orbit_description: true
    materialize_agents_from_meta: true
